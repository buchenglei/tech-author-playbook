# =============================================================================
#  config.toml —— 书稿身份与版式（样书）
# =============================================================================

[doc]
title = "如何写一本技术书"
subtitle = "可验证承诺 · 三层骨架 · 断言分级"
authors = ["CodeBu"]
team = "基础架构"
org = "示例出版社"
version = "v0.4"
date = "2026-10-20"
category = "技术写作"
keywords = ["技术写作", "书籍结构", "断言分级", "交接包"]
abstract = "技术书读不下去的主因不是知识深度不够，而是承诺不可验证、章节并列无递进、断言无来源。本书给出可验证承诺、现象/机制/代价三层骨架与 E0–E3 断言分级，并以门禁冻结单元。正文由 writing-rules 流程写成，工程问题见仓库 PROBLEMS.md。"
history = [
  ["v0.4", "2026-10-20", "改为成书版式样书", "CodeBu"],
]

[layout]
cover = true
toc = true
toc-depth = 2
header = true
chapter-pagebreak = true
# 首行缩进 2 字（书感）；写 "0em" 关闭
indent = "2em"
# 默认 jis-b5；可选 a4 / a5
paper = "jis-b5"

[color]
# 成书基色：深墨蓝。可逐项覆盖 accent / accent-ink / accent-soft / accent-wash
accent = "#1e3a8a"

[code]
theme = "github"
theme-path = "themes/github.tmTheme"
show-lang = true
show-lines = true
# 与正文同宽，长代码少折行
width = "100%"

[fonts]
# 正文衬线（书感）；标题由引擎用 sans
serif = ["Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun"]
sans = ["PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Heiti SC"]
mono = ["Maple Mono NF", "Maple Mono", "Cascadia Code", "Consolas"]

[[chapters]]
path = "chapters/preface.typ"
note = "前言"

[[chapters]]
path = "chapters/ch1.typ"
note = "第1章 读者为什么把书放下"

[[chapters]]
path = "chapters/ch2.typ"
note = "第2章 承诺：从主题到可验证契约"

[[chapters]]
path = "chapters/ch3.typ"
note = "第3章 骨架：从承诺到可跳读目录"

[[chapters]]
path = "chapters/ch4.typ"
note = "第4章 成书：断言、冻结与交接"

[[chapters]]
path = "chapters/appendix-a.typ"
note = "附录 速查"
